//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id 'maven-publish'
	alias libs.plugins.loom apply false
}

allprojects {
	apply plugin: 'maven-publish'
	apply plugin: libs.plugins.loom.get().pluginId

	version = "$modVersion+${libs.versions.mc.get()}"
	base.archivesName = project.modId

	repositories {
		maven { url 'https://maven.terraformersmc.com/releases/' }
		exclusiveContent {
			forRepository {
				maven {
					name = "Modrinth"
					url = "https://api.modrinth.com/maven"
				}
			}
			filter {
				includeGroup "maven.modrinth"
			}
		}
		maven { url 'https://repo.sleeping.town/' }
	}

	dependencies {
		minecraft libs.mc
		mappings variantOf(libs.yarn) { classifier "v2" }

		modImplementation libs.fl
	}

	processResources {
		final Map<String, String> meta = [
				version       : project.version,
				modId         : project.modId,
				modName       : project.modName,
				modDescription: project.modDescription,
				homepage      : "https://modrinth.com/mod/${project.modrinth_slug}",
				issues        : "https://github.com/${project.github_user}/${project.github_slug}/issues",
				sources       : "https://github.com/${project.github_user}/${project.github_slug}",
				license       : project.license,
				authors       : project.authors.split(", ").join("\",\n    \""),
				contributors  : project.contributors.split(", ").join("\",\n    \""),
				members       : "${project.authors}${project.contributors ? ". Contributions by ${project.contributors}." : ""}",
				mc            : project.compatibleVersions.split(", ")[0],
				fl            : libs.versions.fl.get(),
				fapi          : libs.versions.fapi.get(),
		]
		inputs.properties meta
		filesMatching("*.mod.json") { expand(meta) }
		filesMatching("META-INF/*mods.toml") { expand(meta) }
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = "UTF-8"
		it.options.release = 21
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	jar {
		from("LICENSE") {
		}
	}

	publishing {
		repositories {
		}
		publications {
			mavenJava(MavenPublication) {
				from components.java
			}
		}
	}
}

dependencies {
	rootProject.subprojects.each { pro ->
		if (pro != rootProject) include(implementation rootProject.project(":${pro.name}"))
	}
}